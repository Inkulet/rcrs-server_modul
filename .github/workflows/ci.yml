# Я запускаю юнит-тесты модуля на каждый push и pull request.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  tests:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: rcrs_module
    steps:
      - uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: rcrs_module/requirements.txt

      - name: Установка зависимостей
        run: pip install -r requirements.txt

      - name: Юнит-тесты
        run: python -m pytest tests/ -v --tb=short

  docker:
    name: docker build
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - name: Сборка образа
        run: docker build -t rcrs-module:ci .
